version: '3.3'
services:
  foundry:
    image: foundry_dev:v12
    build:
      context: .
      dockerfile: Dockerfile
      args:
        version: v12
    command: '--adminKey=1 --noupdate --world=e2e'
    ports:
      - '3000:30000'
    volumes:
      - data:/home/foundry/data
      - ../../dist:/home/foundry/fvtt-syrin-control
volumes:
  data:
